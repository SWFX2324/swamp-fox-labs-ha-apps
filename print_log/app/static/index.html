<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Log</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-banner" id="offline" role="alert" hidden>Can’t reach the Print Log app. It may be restarting; retrying…</div>

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8h10M9 8v3l3 3 3-3V8M8 18h8"/></svg>
      <h1>Print Log</h1>
    </div>
    <label class="printer-pick" id="printer-pick" hidden><span class="sr">Printer</span><select id="printer-select"></select></label>
    <span class="spacer"></span>
    <span class="ctl" id="ctl" role="status"></span>
    <button id="theme" type="button" class="ghost icon" aria-label="Appearance: automatic" title="Appearance: automatic">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m0 18V4a8 8 0 0 1 0 16"/></svg>
    </button>
  </header>

  <main class="grid">
    <section class="card span-12" id="live" aria-label="Printer"><div class="empty">Loading…</div></section>
    <section class="card span-5" id="start" aria-label="Start a print" hidden></section>
    <section class="card span-7" id="spools" aria-label="Spools" hidden></section>
    <section class="card span-12" id="month" aria-label="This month" hidden></section>
    <section class="card span-5" id="chart" aria-label="Filament per day" hidden></section>
    <section class="card span-7" id="energy" aria-label="Energy" hidden></section>
    <section class="card span-12" id="history" aria-label="Print history" hidden></section>
  </main>
  <footer class="foot" id="foot">Print Log</footer>

  <div class="modal-bg" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-box"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <input type="file" id="file-input" accept=".3mf" hidden>

  <script src="app.js"></script>
</body>
</html>
