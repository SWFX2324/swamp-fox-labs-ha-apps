# Checks every push and pull request: Home Assistant's app linter on each
# config.yaml, that each AppArmor profile parses, a syntax check of every
# script, the unit and end-to-end tests, the blueprints, and each built image
# running under its enforced AppArmor profile.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: App linter (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [ham_dashboard, adsb_tracker, weather_observatory, station_health, print_log, mesh_hub]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: frenck/action-app-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./${{ matrix.app }}
      # Home Assistant refuses to install an app whose profile doesn't parse.
      # This only parses it (-Q: not loaded into the runner's kernel).
      - name: AppArmor profile parses
        run: |
          sudo apt-get install -y -qq apparmor > /dev/null
          sudo apparmor_parser -Q -K -T ${{ matrix.app }}/apparmor.txt
          echo "apparmor.txt parses"

  test:
    name: Syntax and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Syntax check
        run: for f in $(find ham_dashboard/app adsb_tracker/app adsb_tracker/tests weather_observatory/app weather_observatory/tests station_health/app station_health/tests print_log/app print_log/tests mesh_hub/app mesh_hub/tests -name '*.js' -not -path '*/lib/*'); do node --check "$f" || exit 1; done
      - name: Ham Radio Dashboard tests
        run: node --test "ham_dashboard/tests/*.test.js"
      - name: ADS-B Tracker tests
        run: node --test "adsb_tracker/tests/*.test.js"
      - name: Weather Observatory tests
        run: node --test "weather_observatory/tests/*.test.js"
      - name: Station Health tests
        run: node --test "station_health/tests/*.test.js"
      - name: Print Log tests
        run: node --test "print_log/tests/*.test.js"
      - name: Mesh Hub tests
        run: node --test "mesh_hub/tests/*.test.js"
      - name: Blueprints
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 .github/scripts/check_blueprints.py

  apparmor:
    name: Image under AppArmor (ham_dashboard)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --quiet -t ham-dashboard:ci --build-arg BUILD_VERSION=ci ham_dashboard
      # Loaded into the runner's kernel and enforced, as Home Assistant does.
      - name: Load the AppArmor profile
        run: |
          sudo apt-get install -y -qq apparmor > /dev/null
          sudo apparmor_parser -r -W ham_dashboard/apparmor.txt
      - name: Run the image and call every endpoint
        run: bash .github/scripts/apparmor_smoke.sh

  apparmor-adsb:
    name: Image under AppArmor (adsb_tracker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --quiet -t adsb-tracker:ci --build-arg BUILD_VERSION=ci adsb_tracker
      - name: Load the AppArmor profile
        run: |
          sudo apt-get install -y -qq apparmor > /dev/null
          sudo apparmor_parser -r -W adsb_tracker/apparmor.txt
      - name: Run the image and call every endpoint
        run: bash .github/scripts/apparmor_smoke_adsb.sh

  apparmor-weather:
    name: Image under AppArmor (weather_observatory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
